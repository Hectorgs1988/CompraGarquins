services:
  db:
    image: mysql:8.4
    container_name: cesta-db
    environment:
      MYSQL_DATABASE: cestagarquins
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cesta-api
    environment:
      NODE_ENV: development
      PORT: 4100
      DB_CLIENT: mysql2
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: cestagarquins
      CORS_ORIGIN: http://localhost:${WEB_HOST_PORT:-5174}
    ports:
      - "${API_HOST_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cesta-web
    environment:
      VITE_API_URL: ""
    ports:
      - "${WEB_HOST_PORT:-5174}:5174"
    depends_on:
      - api

  adminer:
    image: adminer:4
    container_name: cesta-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
