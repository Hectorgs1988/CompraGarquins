services:
  postgres:
    image: postgres:16-alpine
    container_name: cesta-postgres
    environment:
      POSTGRES_DB: cestagarquins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles: ["postgres"]

  mysql:
    image: mysql:8.4
    container_name: cesta-mysql
    environment:
      MYSQL_DATABASE: cestagarquins
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    profiles: ["mysql"]

volumes:
  pg_data:
  mysql_data:
