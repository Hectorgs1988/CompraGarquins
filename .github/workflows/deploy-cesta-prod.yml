name: Deploy cesta-prod

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cesta-prod-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to cesta-prod
    runs-on: [self-hosted, Linux, X64, rural-prod-deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend build
        run: npm run build -w apps/web

      - name: Deploy backend
        run: |
          ssh cesta-prod '/opt/cesta-prod/deploy.sh'

      - name: Check public API
        run: |
          curl --fail --silent --show-error \
            https://api-cesta.rural-connect.es/health
